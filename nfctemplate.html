<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JEICEN JOSHUA - Digital Card</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0b0f19;
            background: radial-gradient(circle at top, #141d33 0%, #0b0f19 80%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 16px;
        }

        .card-container {
            width: 100%;
            max-width: 380px;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            padding: 32px 20px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        /* Profile Picture with Gradient Ring & Verified Badge */
        .profile-wrapper {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 16px auto;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, #a855f7, #3b82f6, #06b6d4);
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: #0b0f19;
            display: block;
        }

        .verified-badge {
            position: absolute;
            bottom: 2px;
            right: 2px;
            background: #38bdf8;
            color: #0b0f19;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            border: 2px solid #0b0f19;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
            letter-spacing: -0.3px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #38bdf8;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .bio {
            font-size: 0.82rem;
            color: #94a3b8;
            line-height: 1.4;
            margin-bottom: 24px;
            padding: 0 10px;
        }

        /* Call Button Style */
        .call-btn {
            display: flex;
            align-items: center;
            background: linear-gradient(135deg, #10b981, #059669);
            padding: 14px 18px;
            border-radius: 18px;
            text-decoration: none;
            color: #ffffff;
            margin-bottom: 24px;
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.25);
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease;
        }

        .call-btn .icon-box {
            width: 38px;
            height: 38px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 14px;
            font-size: 1rem;
        }

        .call-btn .text-box {
            text-align: left;
        }

        .call-btn .title-text {
            font-weight: 700;
            font-size: 1rem;
            line-height: 1.2;
        }

        .call-btn .sub-text {
            font-size: 0.82rem;
            opacity: 0.9;
            margin-top: 2px;
        }

        /* Section Divider */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #64748b;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .divider::before { margin-right: 12px; }
        .divider::after { margin-left: 12px; }

        /* Social Buttons List */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            border-radius: 16px;
            text-decoration: none;
            color: #ffffff;
            font-size: 0.92rem;
            font-weight: 600;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease;
            user-select: none;
        }

        .btn-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-left i {
            font-size: 1.2rem;
            width: 20px;
            text-align: center;
        }

        .btn-right {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.82rem;
            opacity: 0.85;
            font-weight: 400;
        }

        /* Brand Colors */
        .instagram { background: linear-gradient(90deg, #f09433, #dc2743, #cc2366); }
        .tiktok { background: #121212; border: 1px solid rgba(255, 255, 255, 0.12); }
        .facebook { background: #1877f2; }
        .telegram { background: #229ed9; }
        
        .save-btn {
            background: #ffffff;
            color: #0b0f19;
            justify-content: center;
            font-weight: 700;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.15);
        }

        .save-btn i {
            margin-right: 8px;
        }

        /* Button Hover & Tap Animations */
        .btn:hover, .call-btn:hover {
            transform: scale(1.03) translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .btn:active, .call-btn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- Profile Picture & Verified Badge -->
        <div class="profile-wrapper">
            <img src="logo.jpeg" alt="JEICEN JOSHUA" class="profile-img" onerror="this.src='https://via.placeholder.com/110'">
            <div class="verified-badge">
                <i class="fa-solid fa-check"></i>
            </div>
        </div>
        
        <h1>JEICEN JOSHUA</h1>
        <div class="subtitle">Digital Creator & Student</div>
        <p class="bio">Just a kid with a big dream</p>

        <!-- Call Button Card -->
        <a href="tel:+09766076019" class="call-btn">
            <div class="icon-box">
                <i class="fa-solid fa-phone"></i>
            </div>
            <div class="text-box">
                <div class="title-text">Call Now</div>
                <div class="sub-text">(+09766076019)</div>
            </div>
        </a>

        <!-- Section Divider Line -->
        <div class="divider">Social Channels</div>

        <div class="links-container">
            <!-- Instagram -->
            <a href="https://instagram.com/itsyour_fav_boy" target="_blank" class="btn instagram">
                <div class="btn-left">
                    <i class="fa-brands fa-instagram"></i>
                    <span>Instagram</span>
                </div>
                <div class="btn-right">
                    <span>@itsyour_fav_boy</span>
                    <i class="fa-solid fa-arrow-up-right-from-square"></i>
                </div>
            </a>

            <!-- TikTok -->
            <a href="https://tiktok.com/@user34991384876" target="_blank" class="btn tiktok">
                <div class="btn-left">
                    <i class="fa-brands fa-tiktok"></i>
                    <span>TikTok</span>
                </div>
                <div class="btn-right">
                    <span>@user34991384876</span>
                    <i class="fa-solid fa-arrow-up-right-from-square"></i>
                </div>
            </a>

            <!-- Facebook -->
            <a href="https://www.facebook.com/share/1FJK9KntJB/" target="_blank" class="btn facebook">
                <div class="btn-left">
                    <i class="fa-brands fa-facebook-f"></i>
                    <span>Facebook</span>
                </div>
                <div class="btn-right">
                    <span>@Jeicen_Joshua</span>
                    <i class="fa-solid fa-arrow-up-right-from-square"></i>
                </div>
            </a>

            <!-- Telegram -->
            <a href="https://t.me/Raiz1590" target="_blank" class="btn telegram">
                <div class="btn-left">
                    <i class="fa-brands fa-telegram"></i>
                    <span>Telegram</span>
                </div>
                <div class="btn-right">
                    <span>@Raiz1590</span>
                    <i class="fa-solid fa-arrow-up-right-from-square"></i>
                </div>
            </a>
        </div>

        <!-- Save Contact Button -->
        <a href="contact.vcf" class="btn save-btn">
            <i class="fa-solid fa-address-book"></i> Save Contact
        </a>
    </div>

</body>
</html>
